esphome:
  name: labor

  on_boot:
    then:
      - script.execute: led_boot_blink
      - delay: 15s
      - lambda: |-
          id(telegram_ready) = true;

# ── Substitutions ──────────────────────────────────────────────────────
# Centralised constants — change here, applied everywhere.
substitutions:
  telegram_bot_token: !secret telegram_bot_token
  telegram_chat_id: !secret telegram_chat_id

  # Timing (used in lambdas as milliseconds)
  cooldown_ms: "3600000"          # 1 hour between pumps per zone
  check_interval: "30s"
  heartbeat_interval: "2h"        # uptime report via Telegram
  telegram_poll_interval: "5s"    # how often to poll for bot commands

  # Status LED pin (active-low on most ESP32 DevKits)
  led_pin: "GPIO2"

# ── Globals ────────────────────────────────────────────────────────────
globals:
  - id: telegram_ready
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: telegram_message
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: telegram_last_update_id
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: telegram_message_ready
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: last_pump_1_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: last_pump_2_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: last_pump_3_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: last_pump_4_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: dry_1_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: dry_2_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: dry_3_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: dry_4_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: dry_1_alerted
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: dry_2_alerted
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: dry_3_alerted
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: dry_4_alerted
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: pump_busy
    type: bool
    restore_value: false
    initial_value: 'false'

# ── Board ──────────────────────────────────────────────────────────────
esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: WARN

# ── Network & Security ────────────────────────────────────────────────
api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks:
    - ssid: !secret ssid
      password: !secret password_wifi
      priority: 0
  power_save_mode: none
  fast_connect: true
  reboot_timeout: 0s

  on_connect:
    then:
      - script.stop: led_boot_blink
      - light.turn_on: status_led
      - if:
          condition:
            lambda: 'return id(telegram_ready);'
          then:
            - http_request.get:
                url: "https://api.telegram.org/bot${telegram_bot_token}/sendMessage?chat_id=${telegram_chat_id}&text=ESP%20connected"

  on_disconnect:
    then:
      - light.turn_off: status_led
      - script.execute: led_boot_blink

  ap:
    ssid: "Labor Fallback Hotspot"
    password: !secret password_ap

captive_portal:

web_server:
  port: 80
  version: 3

http_request:

# ── Manual Controls ───────────────────────────────────────────────────
button:
  - platform: template
    name: "Test Telegram"
    on_press:
      - if:
          condition:
            and:
              - wifi.connected
              - lambda: 'return id(telegram_ready);'
          then:
            - http_request.get:
                url: "https://api.telegram.org/bot${telegram_bot_token}/sendMessage?chat_id=${telegram_chat_id}&text=Test%20message%20from%20ESPHome"

# ── Status LED ─────────────────────────────────────────────────────────
output:
  - platform: gpio
    pin: ${led_pin}
    id: status_led_gpio

light:
  - platform: binary
    output: status_led_gpio
    id: status_led
    name: "Status LED"
    internal: true

# ── Soil-Moisture Sensors (ADC → calibrated %) ───────────────────────
sensor:
  - platform: uptime
    name: "ESP Uptime"
    id: esp_uptime
    update_interval: 60s
  - platform: adc
    pin: GPIO32
    name: "Bodenfeuchtigkeit 1"
    id: feuchte_1
    update_interval: 1s
    attenuation: 12db
    unit_of_measurement: "%"
    filters:
      - multiply: 100
      - lambda: |-
          float y = -0.53125f * x + 111.25f;
          if (y < 0.0f) return 0.0f;
          if (y > 100.0f) return 100.0f;
          return y;
      - exponential_moving_average:
          alpha: 0.1
          send_every: 1
  - platform: adc
    pin: GPIO33
    name: "Bodenfeuchtigkeit 2"
    id: feuchte_2
    update_interval: 1s
    attenuation: 12db
    unit_of_measurement: "%"
    filters:
      - multiply: 100
      - lambda: |-
          float y = -0.53125f * x + 111.25f;
          if (y < 0.0f) return 0.0f;
          if (y > 100.0f) return 100.0f;
          return y;
      - exponential_moving_average:
          alpha: 0.1
          send_every: 1
  - platform: adc
    pin: GPIO39
    name: "Bodenfeuchtigkeit 3"
    id: feuchte_3
    update_interval: 1s
    attenuation: 12db
    unit_of_measurement: "%"
    filters:
      - multiply: 100
      - lambda: |-
          float y = -0.53125f * x + 111.25f;
          if (y < 0.0f) return 0.0f;
          if (y > 100.0f) return 100.0f;
          return y;
      - exponential_moving_average:
          alpha: 0.1
          send_every: 1
  - platform: adc
    pin: GPIO35
    name: "Bodenfeuchtigkeit 4"
    id: feuchte_4
    update_interval: 1s
    attenuation: 12db
    unit_of_measurement: "%"
    filters:
      - multiply: 100
      - lambda: |-
          float y = -0.53125f * x + 111.25f;
          if (y < 0.0f) return 0.0f;
          if (y > 100.0f) return 100.0f;
          return y;
      - exponential_moving_average:
          alpha: 0.1
          send_every: 1

  # ── Cooldown timers (read-only, displayed in UI) ───────────────────
  - platform: template
    name: "Topf 1 Cooldown (min)"
    id: topf_1_cooldown_min
    update_interval: 5s
    unit_of_measurement: "min"
    accuracy_decimals: 0
    lambda: |-
      if (id(last_pump_1_ms) == 0) return 0;
      uint32_t elapsed = millis() - id(last_pump_1_ms);
      uint32_t cd = ${cooldown_ms};
      return (elapsed >= cd) ? 0 : (cd - elapsed) / 60000.0;
  - platform: template
    name: "Topf 2 Cooldown (min)"
    id: topf_2_cooldown_min
    update_interval: 5s
    unit_of_measurement: "min"
    accuracy_decimals: 0
    lambda: |-
      if (id(last_pump_2_ms) == 0) return 0;
      uint32_t elapsed = millis() - id(last_pump_2_ms);
      uint32_t cd = ${cooldown_ms};
      return (elapsed >= cd) ? 0 : (cd - elapsed) / 60000.0;
  - platform: template
    name: "Topf 3 Cooldown (min)"
    id: topf_3_cooldown_min
    update_interval: 5s
    unit_of_measurement: "min"
    accuracy_decimals: 0
    lambda: |-
      if (id(last_pump_3_ms) == 0) return 0;
      uint32_t elapsed = millis() - id(last_pump_3_ms);
      uint32_t cd = ${cooldown_ms};
      return (elapsed >= cd) ? 0 : (cd - elapsed) / 60000.0;
  - platform: template
    name: "Topf 4 Cooldown (min)"
    id: topf_4_cooldown_min
    update_interval: 5s
    unit_of_measurement: "min"
    accuracy_decimals: 0
    lambda: |-
      if (id(last_pump_4_ms) == 0) return 0;
      uint32_t elapsed = millis() - id(last_pump_4_ms);
      uint32_t cd = ${cooldown_ms};
      return (elapsed >= cd) ? 0 : (cd - elapsed) / 60000.0;

# ── User-Adjustable Parameters ────────────────────────────────────────
number:
  # Per-zone dryness thresholds (0–100 %)
  - platform: template
    name: "Trocken-Schwellenwert 1"
    id: trocken_schwelle_1
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 50
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
  - platform: template
    name: "Trocken-Schwellenwert 2"
    id: trocken_schwelle_2
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 50
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
  - platform: template
    name: "Trocken-Schwellenwert 3"
    id: trocken_schwelle_3
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 50
    restore_value: true
    unit_of_measurement: "%"
    mode: slider
  - platform: template
    name: "Trocken-Schwellenwert 4"
    id: trocken_schwelle_4
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 50
    restore_value: true
    unit_of_measurement: "%"
    mode: slider

  # Pump duration — shared across all zones
  - platform: template
    name: "Pumpdauer"
    id: pumpdauer
    optimistic: true
    min_value: 5
    max_value: 120
    step: 5
    initial_value: 30
    restore_value: true
    unit_of_measurement: "s"
    mode: slider

# ── Actuators (active-HIGH relays — do NOT use inverted: true) ────────
switch:
  - platform: gpio
    pin: GPIO17
    id: pumpe
    name: "Pumpe"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO22
    id: ventil_1
    name: "Ventil 1"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO21
    id: ventil_2
    name: "Ventil 2"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO19
    id: ventil_3
    name: "Ventil 3"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO18
    id: ventil_4
    name: "Ventil 4"
    restore_mode: ALWAYS_OFF

# ── Dryness Indicators ────────────────────────────────────────────────
binary_sensor:
  - platform: template
    name: "Topf 1 zu trocken"
    id: zu_trocken_1
    lambda: |-
      return id(feuchte_1).state < id(trocken_schwelle_1).state;
  - platform: template
    name: "Topf 2 zu trocken"
    id: zu_trocken_2
    lambda: |-
      return id(feuchte_2).state < id(trocken_schwelle_2).state;
  - platform: template
    name: "Topf 3 zu trocken"
    id: zu_trocken_3
    lambda: |-
      return id(feuchte_3).state < id(trocken_schwelle_3).state;
  - platform: template
    name: "Topf 4 zu trocken"
    id: zu_trocken_4
    lambda: |-
      return id(feuchte_4).state < id(trocken_schwelle_4).state;
  - platform: template
    name: "Pumpe läuft"
    lambda: |-
      return id(pumpe).state;

# ── Scheduler ──────────────────────────────────────────────────────────
# Every ${check_interval} seconds, check zones 1→4 sequentially.
# Only the first eligible zone triggers; pump_busy prevents overlap.
interval:
  - interval: ${check_interval}
    then:
      - if:
          condition:
            lambda: |-
              if (id(pump_busy)) return false;
              if (!id(zu_trocken_1).state) return false;
              if (id(last_pump_1_ms) == 0) return true;
              return (millis() - id(last_pump_1_ms)) >= ${cooldown_ms}UL;
          then:
            - lambda: 'id(pump_busy) = true;'
            - script.execute: pumpe_topf_1
      - if:
          condition:
            lambda: |-
              if (id(pump_busy)) return false;
              if (!id(zu_trocken_2).state) return false;
              if (id(last_pump_2_ms) == 0) return true;
              return (millis() - id(last_pump_2_ms)) >= ${cooldown_ms}UL;
          then:
            - lambda: 'id(pump_busy) = true;'
            - script.execute: pumpe_topf_2
      - if:
          condition:
            lambda: |-
              if (id(pump_busy)) return false;
              if (!id(zu_trocken_3).state) return false;
              if (id(last_pump_3_ms) == 0) return true;
              return (millis() - id(last_pump_3_ms)) >= ${cooldown_ms}UL;
          then:
            - lambda: 'id(pump_busy) = true;'
            - script.execute: pumpe_topf_3
      - if:
          condition:
            lambda: |-
              if (id(pump_busy)) return false;
              if (!id(zu_trocken_4).state) return false;
              if (id(last_pump_4_ms) == 0) return true;
              return (millis() - id(last_pump_4_ms)) >= ${cooldown_ms}UL;
          then:
            - lambda: 'id(pump_busy) = true;'
            - script.execute: pumpe_topf_4
      # ── 24-hour Persistent Dry Alerts ─────────────────────────────────
      - if:
          condition:
            binary_sensor.is_on: zu_trocken_1
          then:
            - lambda: |-
                if (id(dry_1_start_ms) == 0) {
                  id(dry_1_start_ms) = millis();
                }
            - if:
                condition:
                  lambda: |-
                    if (id(dry_1_alerted)) {
                      return false;
                    }
                    if (id(dry_1_start_ms) == 0) {
                      return false;
                    }
                    return (millis() - id(dry_1_start_ms)) >= 86400000UL;
                then:
                  - if:
                      condition:
                        and:
                          - wifi.connected
                          - lambda: 'return id(telegram_ready);'
                      then:
                        - http_request.get:
                            url: "https://api.telegram.org/bot${telegram_bot_token}/sendMessage?chat_id=${telegram_chat_id}&text=Pod%201%20dry%20for%2024h"
                  - lambda: |-
                      id(dry_1_alerted) = true;
          else:
            - lambda: |-
                id(dry_1_start_ms) = 0;
                id(dry_1_alerted) = false;
      - if:
          condition:
            binary_sensor.is_on: zu_trocken_2
          then:
            - lambda: |-
                if (id(dry_2_start_ms) == 0) {
                  id(dry_2_start_ms) = millis();
                }
            - if:
                condition:
                  lambda: |-
                    if (id(dry_2_alerted)) {
                      return false;
                    }
                    if (id(dry_2_start_ms) == 0) {
                      return false;
                    }
                    return (millis() - id(dry_2_start_ms)) >= 86400000UL;
                then:
                  - if:
                      condition:
                        and:
                          - wifi.connected
                          - lambda: 'return id(telegram_ready);'
                      then:
                        - http_request.get:
                            url: "https://api.telegram.org/bot${telegram_bot_token}/sendMessage?chat_id=${telegram_chat_id}&text=Pod%202%20dry%20for%2024h"
                  - lambda: |-
                      id(dry_2_alerted) = true;
          else:
            - lambda: |-
                id(dry_2_start_ms) = 0;
                id(dry_2_alerted) = false;
      - if:
          condition:
            binary_sensor.is_on: zu_trocken_3
          then:
            - lambda: |-
                if (id(dry_3_start_ms) == 0) {
                  id(dry_3_start_ms) = millis();
                }
            - if:
                condition:
                  lambda: |-
                    if (id(dry_3_alerted)) {
                      return false;
                    }
                    if (id(dry_3_start_ms) == 0) {
                      return false;
                    }
                    return (millis() - id(dry_3_start_ms)) >= 86400000UL;
                then:
                  - if:
                      condition:
                        and:
                          - wifi.connected
                          - lambda: 'return id(telegram_ready);'
                      then:
                        - http_request.get:
                            url: "https://api.telegram.org/bot${telegram_bot_token}/sendMessage?chat_id=${telegram_chat_id}&text=Pod%203%20dry%20for%2024h"
                  - lambda: |-
                      id(dry_3_alerted) = true;
          else:
            - lambda: |-
                id(dry_3_start_ms) = 0;
                id(dry_3_alerted) = false;
      - if:
          condition:
            binary_sensor.is_on: zu_trocken_4
          then:
            - lambda: |-
                if (id(dry_4_start_ms) == 0) {
                  id(dry_4_start_ms) = millis();
                }
            - if:
                condition:
                  lambda: |-
                    if (id(dry_4_alerted)) {
                      return false;
                    }
                    if (id(dry_4_start_ms) == 0) {
                      return false;
                    }
                    return (millis() - id(dry_4_start_ms)) >= 86400000UL;
                then:
                  - if:
                      condition:
                        and:
                          - wifi.connected
                          - lambda: 'return id(telegram_ready);'
                      then:
                        - http_request.get:
                            url: "https://api.telegram.org/bot${telegram_bot_token}/sendMessage?chat_id=${telegram_chat_id}&text=Pod%204%20dry%20for%2024h"
                  - lambda: |-
                      id(dry_4_alerted) = true;
          else:
            - lambda: |-
                id(dry_4_start_ms) = 0;
                id(dry_4_alerted) = false;

  # ── Heartbeat — send uptime to Telegram every ${heartbeat_interval} ──
  - interval: ${heartbeat_interval}
    then:
      - if:
          condition:
            and:
              - wifi.connected
              - lambda: 'return id(telegram_ready);'
          then:
            - http_request.get:
                url: !lambda |-
                  char url[256];
                  int total = (int) id(esp_uptime).state;
                  int hours = total / 3600;
                  int minutes = (total % 3600) / 60;
                  int seconds = total % 60;
                  snprintf(
                      url,
                      sizeof(url),
                      "https://api.telegram.org/bot%s/sendMessage?chat_id=%s&text=Heartbeat%%20uptime%%20%dh%%20%dm%%20%ds",
                      "${telegram_bot_token}",
                      "${telegram_chat_id}",
                      hours,
                      minutes,
                      seconds);
                  return std::string(url);

  # ── Telegram Bot Command Polling ─────────────────────────────────────
  # Polls getUpdates every ${telegram_poll_interval} for incoming commands.
  - interval: ${telegram_poll_interval}
    then:
      - if:
          condition:
            wifi.connected
          then:
            - http_request.get:
                url: !lambda |-
                  char url[256];
                  uint32_t offset = id(telegram_last_update_id) + 1;
                  snprintf(
                      url,
                      sizeof(url),
                      "https://api.telegram.org/bot%s/getUpdates?offset=%u&limit=1&timeout=0",
                      "${telegram_bot_token}",
                      offset);
                  return std::string(url);
                capture_response: true
                on_response:
                  then:
                    - lambda: |-
                        auto parsed = json::parse_json(body);
                        if (parsed.containsKey("result")) {
                          auto result_array = parsed["result"].as<JsonArray>();
                          if (result_array.size() > 0) {
                            auto update_obj = result_array[0].as<JsonObject>();
                            if (update_obj.containsKey("update_id")) {
                              id(telegram_last_update_id) = update_obj["update_id"];
                            }
                            auto msg_obj = update_obj["message"].as<JsonObject>();
                            if (msg_obj.containsKey("text")) {
                              std::string text = std::string(msg_obj["text"]);
                              id(telegram_message) = text;
                              id(telegram_message_ready) = true;
                            }
                          }
                        }
                    - if:
                        condition:
                          lambda: 'return id(telegram_message_ready);'
                        then:
                          - script.execute: send_telegram
                          - lambda: 'id(telegram_message_ready) = false;'

# ── Pump Scripts (one per zone) ────────────────────────────────────────
# Each script: close other valves → open target valve → pump for
# id(pumpdauer) seconds → close everything → notify via Telegram.
script:
  - id: pumpe_topf_1
    mode: single
    then:
      - lambda: 'id(last_pump_1_ms) = millis();'
      - switch.turn_off: ventil_2
      - switch.turn_off: ventil_3
      - switch.turn_off: ventil_4
      - switch.turn_on: ventil_1
      - switch.turn_on: pumpe
      - if:
          condition:
            lambda: 'return id(telegram_ready);'
          then:
            - http_request.get:
                url: "https://api.telegram.org/bot${telegram_bot_token}/sendMessage?chat_id=${telegram_chat_id}&text=Pot%201%20started%20pumping"
      - delay: !lambda 'return id(pumpdauer).state * 1000;'
      - switch.turn_off: pumpe
      - switch.turn_off: ventil_1
      - if:
          condition:
            lambda: 'return id(telegram_ready);'
          then:
            - http_request.get:
                url: "https://api.telegram.org/bot${telegram_bot_token}/sendMessage?chat_id=${telegram_chat_id}&text=Pot%201%20stopped%20pumping"
      - lambda: 'id(pump_busy) = false;'

  - id: pumpe_topf_2
    mode: single
    then:
      - lambda: 'id(last_pump_2_ms) = millis();'
      - switch.turn_off: ventil_1
      - switch.turn_off: ventil_3
      - switch.turn_off: ventil_4
      - switch.turn_on: ventil_2
      - switch.turn_on: pumpe
      - if:
          condition:
            lambda: 'return id(telegram_ready);'
          then:
            - http_request.get:
                url: "https://api.telegram.org/bot${telegram_bot_token}/sendMessage?chat_id=${telegram_chat_id}&text=Pot%202%20started%20pumping"
      - delay: !lambda 'return id(pumpdauer).state * 1000;'
      - switch.turn_off: pumpe
      - switch.turn_off: ventil_2
      - if:
          condition:
            lambda: 'return id(telegram_ready);'
          then:
            - http_request.get:
                url: "https://api.telegram.org/bot${telegram_bot_token}/sendMessage?chat_id=${telegram_chat_id}&text=Pot%202%20stopped%20pumping"
      - lambda: 'id(pump_busy) = false;'

  - id: pumpe_topf_3
    mode: single
    then:
      - lambda: 'id(last_pump_3_ms) = millis();'
      - switch.turn_off: ventil_1
      - switch.turn_off: ventil_2
      - switch.turn_off: ventil_4
      - switch.turn_on: ventil_3
      - switch.turn_on: pumpe
      - if:
          condition:
            lambda: 'return id(telegram_ready);'
          then:
            - http_request.get:
                url: "https://api.telegram.org/bot${telegram_bot_token}/sendMessage?chat_id=${telegram_chat_id}&text=Pot%203%20started%20pumping"
      - delay: !lambda 'return id(pumpdauer).state * 1000;'
      - switch.turn_off: pumpe
      - switch.turn_off: ventil_3
      - if:
          condition:
            lambda: 'return id(telegram_ready);'
          then:
            - http_request.get:
                url: "https://api.telegram.org/bot${telegram_bot_token}/sendMessage?chat_id=${telegram_chat_id}&text=Pot%203%20stopped%20pumping"
      - lambda: 'id(pump_busy) = false;'

  - id: pumpe_topf_4
    mode: single
    then:
      - lambda: 'id(last_pump_4_ms) = millis();'
      - switch.turn_off: ventil_1
      - switch.turn_off: ventil_2
      - switch.turn_off: ventil_3
      - switch.turn_on: ventil_4
      - switch.turn_on: pumpe
      - if:
          condition:
            lambda: 'return id(telegram_ready);'
          then:
            - http_request.get:
                url: "https://api.telegram.org/bot${telegram_bot_token}/sendMessage?chat_id=${telegram_chat_id}&text=Pot%204%20started%20pumping"
      - delay: !lambda 'return id(pumpdauer).state * 1000;'
      - switch.turn_off: pumpe
      - switch.turn_off: ventil_4
      - if:
          condition:
            lambda: 'return id(telegram_ready);'
          then:
            - http_request.get:
                url: "https://api.telegram.org/bot${telegram_bot_token}/sendMessage?chat_id=${telegram_chat_id}&text=Pot%204%20stopped%20pumping"
      - lambda: 'id(pump_busy) = false;'


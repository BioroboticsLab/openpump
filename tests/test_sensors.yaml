# Sensor test — view humidity sensor values + toggle valves
# Flash with: ./flash.sh tests/test_sensors.yaml 10.94.201.232
# Then open http://<ESP-IP>:80 to view readings.
#
# NOTE: Valve mapping is REVERSED vs physical:
#   UI Ventil 1 (GPIO18) = Physical Valve 4
#   UI Ventil 2 (GPIO19) = Physical Valve 3
#   UI Ventil 3 (GPIO21) = Physical Valve 2
#   UI Ventil 4 (GPIO22) = Physical Valve 1

esphome:
  name: labor-test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks:
    - ssid: !secret ssid
      password: !secret password_wifi
  power_save_mode: none
  fast_connect: true
  reboot_timeout: 0s
  ap:
    ssid: "Labor Test AP"
    password: !secret password_ap

captive_portal:

web_server:
  port: 80
  version: 3

# ── Raw ADC sensors (no calibration — see the real values) ────────────
sensor:
  - platform: adc
    pin: GPIO32
    name: "Sensor 1 (GPIO32)"
    id: sensor_1
    update_interval: 2s
    attenuation: 12db
    unit_of_measurement: "V"
    accuracy_decimals: 3
  - platform: adc
    pin: GPIO33
    name: "Sensor 2 (GPIO33)"
    id: sensor_2
    update_interval: 2s
    attenuation: 12db
    unit_of_measurement: "V"
    accuracy_decimals: 3
  - platform: adc
    pin: GPIO34
    name: "Sensor 3 (GPIO34)"
    id: sensor_3
    update_interval: 2s
    attenuation: 12db
    unit_of_measurement: "V"
    accuracy_decimals: 3
  - platform: adc
    pin: GPIO35
    name: "Sensor 4 (GPIO35)"
    id: sensor_4
    update_interval: 2s
    attenuation: 12db
    unit_of_measurement: "V"
    accuracy_decimals: 3

# ── Actuators (same as test_actuators) ────────────────────────────────
switch:
  - platform: gpio
    pin: GPIO17
    id: pumpe
    name: "Pumpe"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO18
    id: ventil_1
    name: "Ventil 1 (GPIO18)"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO19
    id: ventil_2
    name: "Ventil 2 (GPIO19)"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO21
    id: ventil_3
    name: "Ventil 3 (GPIO21)"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO22
    id: ventil_4
    name: "Ventil 4 (GPIO22)"
    restore_mode: ALWAYS_OFF

# Minimal test program — toggle pump & valves from the web UI
# Flash with: esphome run tests/test_actuators.yaml
# Then open http://<ESP-IP>:80 and toggle each switch.
#
# RESULT: Relays are active-HIGH (no inversion needed).

esphome:
  name: labor-test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks:
    - ssid: !secret ssid
      password: !secret password_wifi
  power_save_mode: none
  fast_connect: true
  reboot_timeout: 0s
  ap:
    ssid: "Labor Test AP"
    password: !secret password_ap

captive_portal:

web_server:
  port: 80
  version: 3

# ── Status LED ───────────────────────────────────────────────────────
output:
  - platform: gpio
    pin: GPIO2
    id: status_led_gpio

light:
  - platform: binary
    output: status_led_gpio
    id: status_led
    name: "Status LED"

# ── Actuator Switches (active-HIGH, no inversion) ────────────────────
switch:
  - platform: gpio
    pin: GPIO17
    id: pumpe
    name: "Pumpe"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO22
    id: ventil_1
    name: "Ventil 1"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO21
    id: ventil_2
    name: "Ventil 2"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO19
    id: ventil_3
    name: "Ventil 3"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin: GPIO18
    id: ventil_4
    name: "Ventil 4"
    restore_mode: ALWAYS_OFF

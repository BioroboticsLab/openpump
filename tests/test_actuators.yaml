# Minimal test program — toggle pump & valves from the web UI
# Flash with: esphome run test_actuators.yaml
# Then open http://<ESP-IP>:80 and toggle each switch.
#
# TEST: When you toggle "Pumpe" ON in the web UI, the relay should
#       physically click and the pump should run.
#       If the pump runs when the switch shows OFF → remove "inverted: true"
#       from all switches below and reflash.

esphome:
  name: labor-test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  password: ""
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: ""

wifi:
  networks:
    - ssid: !secret ssid
      password: !secret password_wifi
  ap:
    ssid: "Labor Test AP"
    password: !secret password_ap

captive_portal:

web_server:
  port: 80
  version: 3

# ── Status LED ───────────────────────────────────────────────────────
output:
  - platform: gpio
    pin:
      number: GPIO2
      inverted: true
    id: status_led_gpio

light:
  - platform: binary
    output: status_led_gpio
    id: status_led
    name: "Status LED"

# ── Actuator Switches ────────────────────────────────────────────────
# Currently set to inverted: true (matching valve_2.yaml).
# If polarity is wrong, change all to inverted: false (or remove the line).
switch:
  - platform: gpio
    pin:
      number: GPIO17
      inverted: true
    id: pumpe
    name: "Pumpe"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin:
      number: GPIO18
      inverted: true
    id: ventil_1
    name: "Ventil 1"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin:
      number: GPIO19
      inverted: true
    id: ventil_2
    name: "Ventil 2"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin:
      number: GPIO21
      inverted: true
    id: ventil_3
    name: "Ventil 3"
    restore_mode: ALWAYS_OFF
  - platform: gpio
    pin:
      number: GPIO22
      inverted: true
    id: ventil_4
    name: "Ventil 4"
    restore_mode: ALWAYS_OFF

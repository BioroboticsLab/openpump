# GPIO ADC scan — read ALL available ADC1 pins on ESP32
# Flash with: ./flash.sh tests/test_gpio_scan.yaml 10.94.201.232
# Then open http://<ESP-IP>:80 to view readings.
#
# ESP32 ADC1 pins (usable with WiFi): GPIO32-36, GPIO39
# GPIO37/38 are not exposed on most devkits.
# ADC2 (GPIO0-15) cannot be used while WiFi is active.
#
# Connect sensor 1 to different pins to find which GPIOs work.

esphome:
  name: labor-test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  networks:
    - ssid: !secret ssid
      password: !secret password_wifi
  power_save_mode: none
  fast_connect: true
  reboot_timeout: 0s
  ap:
    ssid: "Labor Test AP"
    password: !secret password_ap

captive_portal:

web_server:
  port: 80
  version: 3

# ── All ADC1 GPIOs ───────────────────────────────────────────────────
sensor:
  - platform: adc
    pin: GPIO32
    name: "GPIO32 (ADC1_CH4)"
    update_interval: 2s
    attenuation: 12db
    unit_of_measurement: "V"
    accuracy_decimals: 3
  - platform: adc
    pin: GPIO33
    name: "GPIO33 (ADC1_CH5)"
    update_interval: 2s
    attenuation: 12db
    unit_of_measurement: "V"
    accuracy_decimals: 3
  - platform: adc
    pin: GPIO34
    name: "GPIO34 (ADC1_CH6)"
    update_interval: 2s
    attenuation: 12db
    unit_of_measurement: "V"
    accuracy_decimals: 3
  - platform: adc
    pin: GPIO35
    name: "GPIO35 (ADC1_CH7)"
    update_interval: 2s
    attenuation: 12db
    unit_of_measurement: "V"
    accuracy_decimals: 3
  - platform: adc
    pin: GPIO36
    name: "GPIO36 (ADC1_CH0 / SVP)"
    update_interval: 2s
    attenuation: 12db
    unit_of_measurement: "V"
    accuracy_decimals: 3
  - platform: adc
    pin: GPIO39
    name: "GPIO39 (ADC1_CH3 / SVN)"
    update_interval: 2s
    attenuation: 12db
    unit_of_measurement: "V"
    accuracy_decimals: 3
